[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalforgeai"
version = "0.7.0"
description = "Opinionated platform for agentic workflows, tooling, and evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "SignalForge AI Team" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
keywords = ["agents", "evaluation", "observability", "distillation", "benchmarks"]
dependencies = [
    "jsonschema>=4.23",
    "openai>=2.14.0",
    "PyYAML>=6.0",
    "types-pyyaml>=6.0.12.20250915",
]

[project.urls]
Homepage = "https://github.com/foaadfarooghian/signalforgeai"
Source = "https://github.com/foaadfarooghian/signalforgeai"
Issues = "https://github.com/foaadfarooghian/signalforgeai/issues"
Changelog = "https://github.com/foaadfarooghian/signalforgeai/blob/prod/CHANGELOG.md"
Security = "https://github.com/foaadfarooghian/signalforgeai/security/advisories/new"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5.0", "mypy>=1.7.0"]
train = [
  # Core ML / Torch
  "torch==2.9.1; platform_system == 'Linux'",
  "torchvision==0.24.1; platform_system == 'Linux'",
  "triton==3.5.1; platform_system == 'Linux'",
  "torchao==0.15.0; platform_system == 'Linux'",

  # Hugging Face ecosystem
  "transformers==4.57.3; platform_system == 'Linux'",
  "datasets==4.3.0; platform_system == 'Linux'",
  "accelerate==1.12.0; platform_system == 'Linux'",
  "huggingface-hub==0.36.0; platform_system == 'Linux'",
  "tokenizers==0.22.1; platform_system == 'Linux'",
  "safetensors==0.7.0; platform_system == 'Linux'",
  "peft==0.18.0; platform_system == 'Linux'",
  "trl==0.24.0; platform_system == 'Linux'",

  # Performance / memory
  "xformers==0.0.33.post2; platform_system == 'Linux'",
  "bitsandbytes==0.49.0; platform_system == 'Linux'",
  "einops==0.8.1; platform_system == 'Linux'",

  # Diffusion / fine-tuning
  "diffusers==0.36.0; platform_system == 'Linux'",
  "sentencepiece==0.2.1; platform_system == 'Linux'",

  # Unsloth
  "unsloth==2025.12.9; platform_system == 'Linux'",
  "unsloth-zoo==2025.12.7; platform_system == 'Linux'",

  # Data / utils
  "numpy==2.3.5; platform_system == 'Linux'",
  "pandas==2.3.3; platform_system == 'Linux'",
  "pyarrow==22.0.0; platform_system == 'Linux'",
  "psutil==7.2.1; platform_system == 'Linux'",
  "regex==2025.11.3; platform_system == 'Linux'",
  "protobuf==6.33.2; platform_system == 'Linux'",
  "msgspec==0.20.0; platform_system == 'Linux'",
  "filelock==3.20.1; platform_system == 'Linux'",
  "requests==2.32.5; platform_system == 'Linux'",
  "urllib3==2.6.2; platform_system == 'Linux'",
  "packaging==25.0; platform_system == 'Linux'",
  "pillow==12.0.0; platform_system == 'Linux'",
  "networkx==3.6.1; platform_system == 'Linux'",
  "sympy==1.14.0; platform_system == 'Linux'",
  "mpmath==1.3.0; platform_system == 'Linux'",
  "typeguard==4.4.4; platform_system == 'Linux'",
  "tyro==1.0.3; platform_system == 'Linux'",

  # Multiprocessing / IO
  "dill==0.4.0; platform_system == 'Linux'",
  "multiprocess==0.70.16; platform_system == 'Linux'",
  "fsspec==2025.9.0; platform_system == 'Linux'",
  "xxhash==3.6.0; platform_system == 'Linux'",
  "python-dateutil==2.9.0.post0; platform_system == 'Linux'",
  "pytz==2025.2; platform_system == 'Linux'",
  "tzdata==2025.3; platform_system == 'Linux'",

  # Async stack (datasets / HF internals)
  "aiohttp==3.13.2; platform_system == 'Linux'",
  "aiosignal==1.4.0; platform_system == 'Linux'",
  "aiohappyeyeballs==2.6.1; platform_system == 'Linux'",
  "attrs==25.4.0; platform_system == 'Linux'",
  "charset-normalizer==3.4.4; platform_system == 'Linux'",
  "frozenlist==1.8.0; platform_system == 'Linux'",
  "multidict==6.7.0; platform_system == 'Linux'",
  "yarl==1.22.0; platform_system == 'Linux'",
  "propcache==0.4.1; platform_system == 'Linux'",

  # Misc
  "jinja2==3.1.6; platform_system == 'Linux'",
  "markupsafe==3.0.3; platform_system == 'Linux'",
  "docstring-parser==0.17.0; platform_system == 'Linux'",

]


[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
signalforgeai = [
  "evaluation/suites/*.json",
  "evaluation/benchmarks/**/*.json",
  "evaluation/benchmarks/**/*.md",
  "exchange/schemas/*.json",
  "models/pricing/config/*.yaml",
  "logging/*.md",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[project.scripts]
signalforgeai-pilot-check = "signalforgeai.pilot_check:main"
signalforgeai-otel-export = "signalforgeai.logging.otel:main"
signalforgeai-dataset-validate = "signalforgeai.export.validate:main"
signalforgeai-pricing-validate = "signalforgeai.models.pricing.validate_openai_pricing:main"
signalforgeai-report-tradeoffs = "signalforgeai.evaluation.report_tradeoffs:main"
signalforgeai-learn = "signalforgeai.learning.learn:main"
signalforgeai-distill-check = "signalforgeai.distillation.check:main"
signalforgeai-benchmark-matrix = "signalforgeai.evaluation.matrix:main"
signalforgeai-exchange = "signalforgeai.exchange.cli:main"
signalforgeai-release-candidate-check = "signalforgeai.release.candidate:main"
