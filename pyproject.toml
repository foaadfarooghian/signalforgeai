[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorfoundry"
version = "0.1.0"
description = "Opinionated platform for agentic workflows, tooling, and evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "TensorFoundry Team" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
    "openai>=2.14.0",
    "PyYAML>=6.0",
    "types-pyyaml>=6.0.12.20250915",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5.0", "mypy>=1.7.0"]
train = [
    "accelerate>=0.30",
    "datasets>=2.0",
    "peft>=0.7",
    "psutil>=5.9",
    "torch>=2.0",
    "transformers>=4.40",
    "trl>=0.7",
    "unsloth>=0.4",
]


[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
tensorfoundry = [
  "evaluation/suites/*.json",
  "models/pricing/*.yaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[project.scripts]
tensorfoundry-pricing-validate = "tensorfoundry.models.pricing.validate_openai_pricing:main"
tensorfoundry-report-tradeoffs = "tensorfoundry.evaluation.report_tradeoffs:main"
tensorfoundry-learn = "tensorfoundry.learning.learn:main"
